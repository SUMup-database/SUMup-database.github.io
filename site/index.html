<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMup Explorer</title>
<meta name="description" content="Explore the SUMup database of surface mass balance, firn temperature and density measurements from the Greenland and Antarctic ice sheets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/overview"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--c-density)"/><circle cx="16" cy="16" r="7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="2" fill="#fff"/></svg>
    <span>SUMup <b>Explorer</b></span></a>
  <nav aria-label="Main">
    <a href="#/overview" data-v="overview">Overview</a>
    <a href="#/map" data-v="map">Map</a>
    <a href="#/sources" data-v="sources">Sources</a>
    <a href="#/search" data-v="search">Search</a>
  </nav>
  <button id="theme" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
</header>

<div id="boot" class="boot" role="status">Loading SUMup metadata…</div>

<main>
  <section id="view-overview" class="view" hidden></section>
  <section id="view-map" class="view map-view" hidden></section>
  <section id="view-sources" class="view src-view" hidden></section>
  <section id="view-search" class="view" hidden></section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
